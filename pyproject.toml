[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellar-flood-sentinel"
version = "0.1.0"
description = "Open-source cellar flood early warning: runoff hazard map x rain intensity x water-level sensor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pandas>=2.0", "numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
cellar-flood = "cellar_flood.cli:main"

[tool.setuptools]
packages = ["cellar_flood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 110
target-version = "py311"
